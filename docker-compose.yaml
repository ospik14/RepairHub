
services:
  app:
    build: .
    container_name: app
    ports: 
      - "8000:8000"
    env_file:
      - ./.env
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./:/app
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: rapair_hub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repair_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  adminer:
    image: adminer
    container_name: repair_hub_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: