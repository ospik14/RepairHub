<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairHub | Майстер</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="dashboard-screen" >
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark-blue shadow-sm sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="fa-solid fa-wrench me-2"></i>RepairHub
                </a>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3 d-none d-md-block">Привіт, <b id="user-name">User</b> 👋</span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Вихід
                    </button>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <div id="stat-container" class="row mb-4">
                <div class="col-md-6 col-lg-3">
                    <div class="stat-card bg-white p-3 shadow-sm rounded d-flex align-items-center">
                        <div class="icon-box bg-light-primary text-primary me-3">
                            <i class="fa-solid fa-list-ul fa-lg"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">Доступні</h6>
                            <h4 class="fw-bold mb-0" id="stat-available">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="stat-card bg-white p-3 shadow-sm rounded d-flex align-items-center">
                        <div class="icon-box bg-light-warning text-warning me-3">
                            <i class="fa-solid fa-clock fa-lg"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">В роботі</h6>
                            <h4 class="fw-bold mb-0" id="stat-in-progress">0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <ul class="nav nav-pills mb-4" id="pills-tab">
                <li class="nav-item">
                    <button id="btn-available" class="nav-link active fw-bold" onclick="loadOrders('available')">
                        <i class="fa-solid fa-inbox me-2"></i>Нові замовлення
                    </button>
                </li>
                <li class="nav-item ms-2">
                    <button id="btn-my" class="nav-link fw-bold" onclick="loadOrders('my')">
                        <i class="fa-solid fa-hammer me-2"></i>Моя робота
                    </button>
                </li>
            </ul>

            <div id="orders-container" class="row g-4">
                <div class="text-center py-5 text-muted">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Завантаження...</p>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="finishModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark-blue text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-check-circle me-2"></i>Завершення замовлення</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <h6 class="fw-bold text-primary mb-3">🛠️ Використані запчастини</h6>
<div class="bg-light p-3 rounded mb-4 border">
    <div class="mb-2">
        <label class="small text-muted mb-1">Пошук запчастини</label>
        
        <input class="form-control mb-2" list="datalistOptions" id="part-search" placeholder="Почни вводити (напр. Дисплей...)">
        <datalist id="datalistOptions">
            </datalist>

        <div class="d-flex gap-2">
            <div class="input-group" style="width: 150px;">
                <span class="input-group-text">К-сть</span>
                <input type="number" id="part-qty" class="form-control" value="1" min="1">
            </div>
            
            <button class="btn btn-primary flex-grow-1" onclick="addPart()">
                <i class="fa-solid fa-plus"></i> Додати
            </button>
        </div>
    </div>
    <small id="part-msg" class="text-success d-none fw-bold"><i class="fa-solid fa-check"></i> Запчастину списано!</small>
</div>

                <hr>

                <h6 class="fw-bold text-success mb-3">💰 Вартість роботи майстра</h6>
                <div class="mb-3">
                    <label class="form-label small text-muted">Введи суму, яку ти береш за свої послуги (без урахування деталей)</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-success text-white border-0">₴</span>
                        <input type="number" id="work-price" class="form-control fw-bold" placeholder="0.00">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light text-muted" data-bs-dismiss="modal">Скасувати</button>
                <button type="button" class="btn btn-success px-4 fw-bold shadow-sm" onclick="finishOrder()">
                    ✅ Закрити замовлення
                </button>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/master.js"></script>
</body>
</html>
