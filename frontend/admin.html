<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairHub | Адмін</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark-blue mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="fa-solid fa-user-shield me-2"></i>Адмін-панель</span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Вихід</button>
        </div>
    </nav>

    <div class="container pb-5">
        
        <h4 class="mb-3 fw-bold text-muted">📊 Статистика</h4>
        <div class="row g-3 mb-5">
            <div class="col-md-3">
                <div class="card p-3 border-0 shadow-sm border-start border-4 border-success">
                    <small class="text-muted">Каса (Місяць)</small>
                    <h3 class="fw-bold text-success" id="stat-money">--- ₴</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 border-0 shadow-sm border-start border-4 border-primary">
                    <small class="text-muted">Виконано замовлень</small>
                    <h3 class="fw-bold text-primary" id="stat-orders">---</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 border-0 shadow-sm border-start border-4 border-warning">
                    <small class="text-muted">Персонал</small>
                    <h3 class="fw-bold text-dark" id="stat-users">---</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 border-0 shadow-sm border-start border-4 border-danger">
                    <small class="text-muted">Критичні залишки</small>
                    <h3 class="fw-bold text-danger" id="stat-low-parts">---</h3>
                </div>
            </div>
        </div>

        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-white p-3">
                <ul class="nav nav-pills card-header-pills" id="adminTabs">
                    <li class="nav-item">
                        <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#users-tab">
                            <i class="fa-solid fa-users me-2"></i>Персонал
                        </button>
                    </li>
                    <li class="nav-item ms-2">
                        <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#parts-tab">
                            <i class="fa-solid fa-boxes-stacked me-2"></i>Склад запчастин
                        </button>
                    </li>
                </ul>
            </div>
            
            <div class="card-body p-4 tab-content">
                
                <div class="tab-pane fade show active" id="users-tab">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold">Список працівників</h5>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
                            <i class="fa-solid fa-user-plus"></i> Додати
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Логін</th>
                                    <th>Роль</th>
                                    <th>Дата створення</th>
                                    <th class="text-end">Дії</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="parts-tab">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold">Запчастини на складі</h5>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addPartModal">
                            <i class="fa-solid fa-plus"></i> Додати запчастину
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Назва</th>
                                    <th>К-сть</th>
                                    <th>Закупка ($)</th>
                                    <th>Продаж (₴)</th>
                                    <th class="text-end">Дії</th>
                                </tr>
                            </thead>
                            <tbody id="parts-table-body"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Новий працівник</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="text" id="new-username" class="form-control mb-2" placeholder="Логін (username)">
                    <input type="password" id="new-password" class="form-control mb-2" placeholder="Пароль">
                    <select id="new-role" class="form-select">
                        <option value="manager">Менеджер</option>
                        <option value="master">Майстер</option>
                        <option value="admin">Адмін</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="createUser()">Створити</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="changePassModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Зміна паролю</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="hidden" id="pass-user-id">
                    <input type="password" id="update-password" class="form-control" placeholder="Новий пароль (min 8 sym)">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-warning" onclick="submitPassChange()">Змінити</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addPartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Нова запчастина</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="text" id="part-name" class="form-control mb-2" placeholder="Назва (напр. Дисплей iPhone 11)">
                    <input type="number" id="part-qty" class="form-control mb-2" placeholder="Кількість" value="1">
                    <div class="row">
                        <div class="col-6"><input type="number" id="part-buy" class="form-control" placeholder="Закупка"></div>
                        <div class="col-6"><input type="number" id="part-sell" class="form-control" placeholder="Продаж"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="createPart()">Додати</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editPartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Редагування</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="hidden" id="edit-part-id">
                    <label class="small text-muted">Кількість</label>
                    <input type="number" id="edit-part-qty" class="form-control mb-2">
                    <label class="small text-muted">Ціна закупки</label>
                    <input type="number" id="edit-part-buy" class="form-control mb-2">
                    <label class="small text-muted">Ціна продажу</label>
                    <input type="number" id="edit-part-sell" class="form-control mb-2">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success" onclick="submitPartEdit()">Зберегти зміни</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
