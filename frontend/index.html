<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairHub | Кабінет Майстра</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen" class="d-flex align-items-center justify-content-center vh-100">
        <div class="login-card p-5 shadow-lg">
            <div class="text-center mb-4">
                <i class="fa-solid fa-wrench fa-3x text-primary mb-2"></i>
                <h2 class="fw-bold">RepairHub</h2>
                <p class="text-muted">Вхід для персоналу</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Логін</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="master_alex" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm btn-animate">
                    Увійти в систему
                </button>
                <div id="error-msg" class="alert alert-danger mt-3 d-none text-center small"></div>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="d-none">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark-blue shadow-sm sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="fa-solid fa-wrench me-2"></i>RepairHub
                </a>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3 d-none d-md-block">Привіт, <b id="user-name">User</b> 👋</span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Вихід
                    </button>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <div class="row mb-4">
                <div class="col-md-6 col-lg-3">
                    <div class="stat-card bg-white p-3 shadow-sm rounded d-flex align-items-center">
                        <div class="icon-box bg-light-primary text-primary me-3">
                            <i class="fa-solid fa-list-ul fa-lg"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">Доступні</h6>
                            <h4 class="fw-bold mb-0" id="stat-available">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="stat-card bg-white p-3 shadow-sm rounded d-flex align-items-center">
                        <div class="icon-box bg-light-warning text-warning me-3">
                            <i class="fa-solid fa-clock fa-lg"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">В роботі</h6>
                            <h4 class="fw-bold mb-0" id="stat-in-progress">0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <ul class="nav nav-pills mb-4" id="pills-tab">
                <li class="nav-item">
                    <button class="nav-link active fw-bold" onclick="loadOrders('available')">
                        <i class="fa-solid fa-inbox me-2"></i>Нові замовлення
                    </button>
                </li>
                <li class="nav-item ms-2">
                    <button class="nav-link fw-bold" onclick="loadOrders('my')">
                        <i class="fa-solid fa-hammer me-2"></i>Моя робота
                    </button>
                </li>
            </ul>

            <div id="orders-container" class="row g-4">
                <div class="text-center py-5 text-muted">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Завантаження...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
