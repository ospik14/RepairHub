<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="login-screen" class="d-flex align-items-center justify-content-center vh-100">
        <div class="login-card p-5 shadow-lg">
            <div class="text-center mb-4">
                <i class="fa-solid fa-wrench fa-3x text-primary mb-2"></i>
                <h2 class="fw-bold">RepairHub</h2>
                <p class="text-muted">Вхід для персоналу</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Логін</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="master_alex" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm btn-animate">
                    Увійти в систему
                </button>
                <div id="error-msg" class="alert alert-danger mt-3 d-none text-center small"></div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
